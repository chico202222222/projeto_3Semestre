<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta · Monitor IoT</title>
  <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body>
  <main class="auth">
    <a class="brand" href="/login">Monitor IoT</a>
    <p class="chillMessage">Instituto Bukokaesen Model. 2026</p>
    <h1>Criar conta</h1>
    <p>Preencha os dados para começar.</p>
    <p id="flashMessage" class="message" role="alert"></p>
    <form action="/register" method="post" id="registerForm" novalidate>
      <label for="name">Nome de usuário</label>
      <input id="name" name="name" type="text" autocomplete="username" minlength="2" maxlength="100" required>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <p class="hint">Use 8 caracteres, com letras maiúsculas, minúsculas e número.</p>
      <p id="error" class="message" role="alert" aria-live="polite"></p>
      <button type="submit">Criar conta</button>
    </form>
    <p class="footer">Já tem uma conta? <a href="/login">Entrar</a></p>
  </main>
  <script type="importmap">{ "imports": { "zod": "https://cdn.jsdelivr.net/npm/zod@4.6.5/+esm" } }</script>
  <script type="module" src="/assets/js/validateUser.js"></script>
  <script>
    fetch('/api/messages')
      .then((res) => res.json())
      .then((messages) => {
        if (messages && messages.length > 0) {
          document.getElementById('flashMessage').textContent = messages[0];
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
